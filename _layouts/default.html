<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav>
          <a href="{{ '/' | relative_url }}">首页</a>
          <a href="{{ '/about/' | relative_url }}">关于</a>
          <a href="https://github.com/zhangkaixuan01" rel="me">GitHub</a>
        </nav>
      </div>
    </header>
    <main class="container">{{ content }}</main>
    <footer class="site-footer"><div class="container">© {{ 'now' | date: '%Y' }} {{ site.author }}</div></footer>
  </body>
</html>
