<!doctype html>
<html lang="{{ site.Language.LanguageCode | default `zh-CN` }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
    <meta name="description" content="{{ .Description | default site.Params.description | plainify | htmlEscape }}">
    <link rel="stylesheet" href="{{ `css/style.css` | relURL }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="{{ `/` | relURL }}">{{ site.Title }}</a>
        <nav>
          <a href="{{ `/` | relURL }}">首页</a>
          <a href="{{ `/about/` | relURL }}">关于</a>
          <a href="https://github.com/zhangkaixuan01" rel="me">GitHub</a>
        </nav>
      </div>
    </header>
    <main class="container">{{ block "main" . }}{{ end }}</main>
    <footer class="site-footer"><div class="container">© {{ now.Year }} {{ site.Params.author }}</div></footer>
  </body>
</html>
