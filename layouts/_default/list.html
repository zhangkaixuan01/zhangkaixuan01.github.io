{{ define "main" }}
<section class="post">
  <header class="post-header"><h1>{{ .Title }}</h1></header>
  <div class="post-list">
    {{ range .Pages }}
      <article class="post-card">
        <p class="post-date">{{ .Date.Format "2006-01-02" }}</p>
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        <p>{{ .Description | default (.Summary | plainify | truncate 120) }}</p>
      </article>
    {{ end }}
  </div>
</section>
{{ end }}
