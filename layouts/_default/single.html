{{ define "main" }}
<article class="post">
  <header class="post-header">
    <p class="post-date">{{ .Date.Format "2006-01-02" }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  <div class="post-content">{{ .Content }}</div>
</article>
{{ end }}
